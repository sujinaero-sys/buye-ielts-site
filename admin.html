<main>
  <div class="wrap">
    <div class="page-head">
      <h1>Admin portal</h1>
      <p>Manage tests and questions, and see how students are doing across BUYE IELTS.</p>
    </div>

    <div class="grid grid-4" id="overviewStats" style="margin-bottom:36px;"></div>

    <h3 style="margin-bottom:16px;">Average band by module (all students)</h3>
    <div class="card" id="moduleAvgCard" style="margin-bottom:40px;">Loading…</div>

    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <h3 style="margin-bottom:6px;">Add a test</h3>
        <p style="color:var(--muted); font-size:0.88rem; margin-bottom:10px;">Creates a container that questions attach to.</p>
        <label for="tTitle">Title</label>
        <input id="tTitle" placeholder="e.g. Academic Reading — Set 3">
        <label for="tType">Exam type</label>
        <select id="tType"><option>Academic</option><option>General Training</option></select>
        <label for="tModule">Module</label>
        <select id="tModule"><option>Listening</option><option>Reading</option><option>Writing</option><option>Speaking</option></select>
        <label for="tDuration">Duration (minutes)</label>
        <input id="tDuration" type="number" value="30">
        <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="addTest()">Add test</button>
        <div class="msg" id="testMsg"></div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:6px;">Add a question</h3>
        <label for="qTest">Test</label>
        <select id="qTest"></select>
        <label for="qType">Question type</label>
        <select id="qType"><option>Multiple Choice</option><option>True/False/Not Given</option><option>Short Answer</option></select>
        <label for="qPrompt">Question / prompt</label>
        <textarea id="qPrompt" placeholder="Question text, or the passage/prompt"></textarea>
        <label for="qA">Option A (leave blank if not multiple choice)</label>
        <input id="qA">
        <label for="qB">Option B</label>
        <input id="qB">
        <label for="qC">Option C</label>
        <input id="qC">
        <label for="qD">Option D</label>
        <input id="qD">
        <label for="qCorrect">Correct answer (must match an option, or True/False/Not Given, or the exact short answer)</label>
        <input id="qCorrect">
        <label for="qMarks">Marks</label>
        <input id="qMarks" type="number" value="1">
        <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="addQuestion()">Add question</button>
        <div class="msg" id="questionMsg"></div>
      </div>
    </div>

    <h3 style="margin:40px 0 16px;">Students</h3>
    <div class="card">
      <table id="usersTable">
        <thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last login</th></tr></thead>
        <tbody><tr><td colspan="4" style="color:var(--muted);">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="assets/config.js"></script>
<script>
  if (requireAuth('admin')) {
    document.getElementById('whoName').textContent = getName();
    loadOverview();
    loadUsers();
    loadTestsIntoDropdown();
  }

  function loadOverview() {
    apiGet('adminOverview', { token: getToken() }).then(function (res) {
      if (!res.success) { alert(res.error); return; }
      const d = res.data;
      document.getElementById('overviewStats').innerHTML =
        stat(d.totalStudents, 'Students') + stat(d.totalTests, 'Tests') +
        stat(d.totalAttempts, 'Attempts') + stat(d.moduleAverages.length, 'Modules with data');

      document.getElementById('moduleAvgCard').innerHTML = d.moduleAverages.length
        ? '<table><thead><tr><th>Module</th><th>Average band</th><th>Attempts</th></tr></thead><tbody>' +
          d.moduleAverages.map(function (m) { return '<tr><td>' + m.module + '</td><td class="num">' + m.average + '</td><td>' + m.totalAttempts + '</td></tr>'; }).join('') +
          '</tbody></table>'
        : '<span style="color:var(--muted);">No completed attempts yet.</span>';
    });
  }

  function loadUsers() {
    apiGet('adminUsers', { token: getToken() }).then(function (res) {
      if (!res.success) return;
      const rows = res.data.map(function (u) {
        return '<tr><td>' + u.Name + '</td><td>' + u.Email + '</td><td>' + fmt(u.CreatedAt) + '</td><td>' + fmt(u.LastLogin) + '</td></tr>';
      }).join('');
      document.getElementById('usersTable').querySelector('tbody').innerHTML = rows || '<tr><td colspan="4">No students yet.</td></tr>';
    });
  }

  function loadTestsIntoDropdown() {
    apiGet('getTests').then(function (res) {
      if (!res.success) return;
      const sel = document.getElementById('qTest');
      sel.innerHTML = res.data.map(function (t) { return '<option value="' + t.TestID + '">' + t.Title + ' (' + t.Module + ')</option>'; }).join('')
        || '<option value="">Add a test first</option>';
    });
  }

  function addTest() {
    apiPost('adminAddTest', {
      token: getToken(),
      title: val('tTitle'), examType: val('tType'), module: val('tModule'),
      durationMinutes: Number(val('tDuration'))
    }).then(function (res) {
      showMsg('testMsg', res.success ? 'Test added.' : res.error, !res.success);
      if (res.success) { document.getElementById('tTitle').value = ''; loadOverview(); loadTestsIntoDropdown(); }
    });
  }

  function addQuestion() {
    const testId = val('qTest');
    if (!testId) { showMsg('questionMsg', 'Add a test first.', true); return; }
    apiPost('adminAddQuestion', {
      token: getToken(), testId: testId, module: document.getElementById('qTest').selectedOptions[0].textContent,
      questionType: val('qType'), prompt: val('qPrompt'),
      optionA: val('qA'), optionB: val('qB'), optionC: val('qC'), optionD: val('qD'),
      correctAnswer: val('qCorrect'), marks: Number(val('qMarks'))
    }).then(function (res) {
      showMsg('questionMsg', res.success ? 'Question added.' : res.error, !res.success);
      if (res.success) ['qPrompt', 'qA', 'qB', 'qC', 'qD', 'qCorrect'].forEach(function (id) { document.getElementById(id).value = ''; });
    });
  }

  function val(id) { return document.getElementById(id).value.trim(); }
  function fmt(d) { const dt = new Date(d); return isNaN(dt) || !d ? '—' : dt.toLocaleDateString(); }
  function stat(value, label) { return '<div class="stat"><div class="value">' + value + '</div><div class="label">' + label + '</div></div>'; }
  function showMsg(id, text, isError) {
    const el = document.getElementById(id);
    el.textContent = text; el.className = 'msg show ' + (isError ? 'error' : 'ok');
  }
</script>
</body>
</html>
